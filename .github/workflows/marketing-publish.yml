name: Publish marketing artifacts to Buffer

on:
  push:
    branches: [main]
    paths:
      - 'content/marketing/*.md'

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compute added files in this commit
        id: changed
        run: |
          ADDED=$(git diff --diff-filter=A --name-only HEAD^ HEAD -- 'content/marketing/*.md' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ADDED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Added files:"
          echo "$ADDED"

      - name: Publish to Buffer
        if: steps.changed.outputs.files != ''
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TWITTER_CHANNEL_ID: ${{ secrets.BUFFER_TWITTER_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/publish-to-buffer.mjs
